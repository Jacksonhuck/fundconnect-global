<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | FUND CONNECT</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #edf4ff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.container {
  background: white;
  padding: 30px;
  width: 85%;
  max-width: 400px;
  border-radius: 12px;
  box-shadow: 0 5px 20px #ccd9eb;
}
h1 { color: #1769d2; text-align: center; }
p { text-align: center; color: #52647a; }
input {
  width: 100%;
  padding: 13px;
  margin: 9px 0;
  border: 1px solid #ccd8e8;
  border-radius: 6px;
  box-sizing: border-box;
}
button {
  width: 100%;
  padding: 14px;
  background: #1769d2;
  color: white;
  border: 0;
  border-radius: 6px;
  font-size: 16px;
}
a { color: #1769d2; }
.back { display: block; text-align: center; margin-top: 18px; }
</style>
</head>
<body>
<div class="container">
<h1>FUND CONNECT</h1>
<p>Create your account</p>
<form id="signupForm">
  <input id="fullName" type="text"
    placeholder="Full name" required>

  <input id="email" type="email"
    placeholder="Email address" required>

  <input id="password" type="password"
    placeholder="Create password" required>

  <button type="submit">Create Account</button>
</form>
<p>Already have an account? <a href="login.html">Login</a></p>
<a class="back" href="index.html">Back to Home</a>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = window.supabase.createClient(
  "https://ebeyscfrevsrqmcrjctp.supabase.co",
  "sb_publishable_XrqvDv0Lk2-OUF05jKZLxA_f0zzJ2O-"
);

document.getElementById("signupForm").addEventListener("submit", async (event) => {
  event.preventDefault();

  const fullName = document.getElementById("fullName").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
      data: { full_name: fullName }
    }
  });

  if (error) {
    alert(error.message);
  } else {
    alert("Account created! Check your email if confirmation is required.");
  }
});
</script>
</body>
</html>
