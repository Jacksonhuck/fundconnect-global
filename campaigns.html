<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore Campaigns | FUND CONNECT</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f8fc;
  color: #18304f;
}
header {
  background: white;
  padding: 20px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  box-shadow: 0 2px 10px #dce5f0;
}
.logo { color: #1769d2; font-size: 23px; font-weight: bold; }
nav a {
  color: #18304f;
  text-decoration: none;
  margin: 0 8px;
  font-weight: bold;
}
.hero {
  text-align: center;
  padding: 45px 20px;
  background: #eaf3ff;
}
.hero h1 { color: #1769d2; }
.container { padding: 35px 7%; }
.search {
  display: block;
  width: 100%;
  max-width: 500px;
  margin: 20px auto 35px;
  padding: 14px;
  border: 1px solid #ccd8e8;
  border-radius: 8px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 20px;
}
.card {
  background: white;
  border-radius: 12px;
  padding: 22px;
  box-shadow: 0 3px 12px #dce5f0;
}
.card h3 { color: #1769d2; }
.progress {
  background: #e1e9f3;
  height: 9px;
  border-radius: 10px;
  overflow: hidden;
}
.bar {
  background: #1769d2;
  width: 0%;
  height: 100%;
}
button {
  background: #1769d2;
  color: white;
  border: 0;
  padding: 12px 18px;
  border-radius: 7px;
}
footer {
  background: #123d75;
  color: white;
  text-align: center;
  padding: 25px;
  margin-top: 40px;
}
</style>
</head>
<body>

<header>
  <div class="logo">FUND CONNECT</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="campaigns.html">Campaigns</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<section class="hero">
  <h1>Discover Fundraisers</h1>
  <p>Find a cause you care about and make a difference.</p>
  <a href="create-campaign.html">
    <button>Start a Fundraiser</button>
  </a>
</section>

<div class="container">
  <input class="search" type="search"
    placeholder="Search fundraisers..."
    oninput="searchCampaigns(this.value)">

  <div class="grid" id="campaignList">
    <div class="card">
      <h3>Campaigns Coming Soon</h3>
      <p>Fundraisers created on FUND CONNECT will appear here once campaign publishing is connected.</p>
      <div class="progress"><div class="bar"></div></div>
    </div>
  </div>
</div>

<footer>
  <p>© 2026 FUND CONNECT. Bringing people together.</p>
</footer>

<script>
function searchCampaigns(value) {
  const cards = document.querySelectorAll(".card");
  cards.forEach(card => {
    card.style.display =
      card.innerText.toLowerCase().includes(value.toLowerCase())
      ? "block" : "none";
  });
}
</script>

</body>
</html>
